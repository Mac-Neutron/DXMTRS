name: CI

# What a hosted runner can check of DXMTRS: rustfmt and the conventions audit (tools/rust-check.sh's fmt and audit
# legs). The build and the other legs (gen, clippy, doc, test) need MacNeutron's toolchain: LLVM 23 from its fork,
# llvm-mingw, the Mac Wine build tree and the VM guest's Wine SDK (docs/DEVELOPMENT.md, "tools/rust-check.sh"), so
# they run in MacNeutron's gates before every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # MacNeutron's dxmt/pins MTLD3D_RUST_NIGHTLY: rustfmt.toml uses unstable options.
      RUST_NIGHTLY: nightly-2026-10-30
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rustfmt --no-self-update
      - name: rustfmt
        run: cargo "+$RUST_NIGHTLY" fmt --all --check
      - name: Audit
        run: sh tools/audit.sh
