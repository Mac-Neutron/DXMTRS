style_edition = "2024"
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
use_field_init_shorthand = true
use_try_shorthand = true
format_code_in_doc_comments = true
# Generated by tools/winemetal-layouts.sh from the C headers; the generator's output is the file.
ignore = [
    "src/airconv/src/abi/layouts.rs",
    "src/dxmt/src/dump/abi.rs",
    "src/dxmt/src/format/abi.rs",
    "src/dxmt/src/presenter/abi.rs",
    "src/dxmt/src/scaler/abi.rs",
    "src/dxmt/src/shader_cache/abi.rs",
    "src/dxmt/src/stats/abi.rs",
    "src/winemetal/src/protos.rs",
    "src/winemetal/sys/src/decls.rs",
    "src/winemetal/wire/src/layouts.rs",
]
