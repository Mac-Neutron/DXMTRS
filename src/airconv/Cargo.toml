[package]
name = "airconv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "LGPL-2.1-or-later"
description = "DXMT's shader translator: DXBC and DXIL to Metal's AIR, behind airconv_public.h"
publish = false

[features]
# The type oracle: checks every value's type as it is made (the tests and the test tools' builds, never meson's).
oracle = []

[dependencies]
airconv-ir = { workspace = true }
rustc-hash = { workspace = true }

[build-dependencies]
cc = { workspace = true }

# `tests/dxso_parity.rs` renders the D3D9 corpus through D3D9's MSL emitters and through
# `airconv::dxso::translate` on the Mac's Metal device (ruling C3-16): both are host-only, and
# `-e normal,build` keeps them out of the translator's key.
[dev-dependencies]
dispatch2 = { workspace = true }
mtld3d-core = { workspace = true, features = ["disk-cache"] }
mtld3d-shared = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true, features = ["dispatch2", "MTLArgument", "MTLBlitCommandEncoder", "MTLPipeline"] }

[lints]
workspace = true
