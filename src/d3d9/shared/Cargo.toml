[package]
name = "mtld3d-shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Zlib"
description = "Direct3D 9 translation layer for Wine on macOS, backed by Metal"
authors = ["Alexander Theissen <alex.theissen@me.com>"]

[features]
# D3D9's developer timers (the 2 s perf grid, perf-kv): sets cfg(perf_tracking). Never in a release.
perf-tracking = []
# DXMT_PERF_BUILD: lines below warnings compiled out.
perf-build = ["dxmt-util/perf-build"]

[dependencies]
airconv-ir = { workspace = true }
bitflags = { workspace = true }
dxmt-util = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
strum = { workspace = true, features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
