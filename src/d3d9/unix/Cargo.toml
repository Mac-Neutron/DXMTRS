[package]
name = "mtld3d-unix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Zlib"
description = "Direct3D 9 translation layer for Wine on macOS, backed by Metal"
authors = ["Alexander Theissen <alex.theissen@me.com>"]

[lib]
crate-type = ["cdylib"]

[features]
# D3D9's developer timers; d3d9.dll needs the same (meson's d3d9_perf_tracking sets both).
perf-tracking = ["mtld3d-core/perf-tracking", "mtld3d-shared/perf-tracking"]
# DXMT_PERF_BUILD: lines below warnings compiled out.
perf-build = ["mtld3d-shared/perf-build"]
# MacNeutron: every Metal call through winemetal's Unix-call table (the `mtl` facade), as in the VM; the window code
# only macOS's Wine has is left out. The Linux build always has it.
winemetal = ["dep:mtld3d-mtl"]

[dependencies]
airconv-ir = { workspace = true }
mtld3d-core = { workspace = true, features = ["disk-cache"] }
mtld3d-types = { workspace = true }
bitflags = { workspace = true }
dxmt-util = { workspace = true }
libc = { workspace = true }
mtld3d-shared = { workspace = true }
mtld3d-mtl = { workspace = true, optional = true }
log = { workspace = true }
rustc-hash = { workspace = true }
snmalloc-rs = { workspace = true }
strum = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# The shader translator, linked into mtld3d.so on the Mac (ruling C3b-8); the guest links none.
airconv = { workspace = true }
block2 = { workspace = true }
dispatch2 = { workspace = true }
libloading = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true, features = ["dispatch2"] }
objc2-metal-fx = { workspace = true }
objc2-quartz-core = { workspace = true }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
mtld3d-mtl = { workspace = true }

[build-dependencies]
cc = { workspace = true }

[lints]
workspace = true
