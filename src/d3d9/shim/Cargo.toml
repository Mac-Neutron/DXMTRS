[package]
name = "mtld3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Zlib"
description = "Direct3D 9 translation layer for Wine on macOS, backed by Metal"
authors = ["Alexander Theissen <alex.theissen@me.com>"]

[lib]
crate-type = ["staticlib"]

[features]
# DXMT_PERF_BUILD: lines below warnings compiled out.
perf-build = ["mtld3d-shared/perf-build"]
# DXMTRS C4d-5: defer `__wine_init_unix_call()` out of `DllMain` until first `mtld3d_unix_call`.
core-runtime = []

[dependencies]
dxmt-util = { workspace = true }
mtld3d-shared = { workspace = true }
log = { workspace = true }

[lints]
workspace = true
