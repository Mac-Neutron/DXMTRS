[package]
name = "d3d9"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "LGPL-2.1-or-later AND Zlib"
description = "Direct3D 9 translation layer for Wine on macOS, backed by Metal"
authors = ["Alexander Theissen <alex.theissen@me.com>"]

[lib]
crate-type = ["staticlib"]

[features]
# Windows PE COM front end (DllMain, exports, SnMalloc, win32 hooks, dxmt_log). Host unit
# tests compile without it so they only link rt + dxmt-fakes on macOS.
front-end = ["dep:snmalloc-rs"]
# D3D9's developer timers (meson's d3d9_perf_tracking).
perf-tracking = ["mtld3d-core/perf-tracking", "mtld3d-shared/perf-tracking"]
# DXMT_PERF_BUILD: lines below warnings compiled out.
perf-build = ["mtld3d-shared/perf-build", "dxmt-core/perf-build"]
# The VM guest's build (meson's guest_vm): guest-only winemetal calls.
guest-vm = ["dxmt-core/guest-vm", "winemetal-sys/guest-vm"]

[dependencies]
airconv-ir = { workspace = true }
bitflags = { workspace = true }
dxmt-core = { workspace = true }
dxmt-util = { workspace = true }
mtld3d-core = { workspace = true }
mtld3d-shared = { workspace = true }
mtld3d-types = { workspace = true }
log = { workspace = true }
rustc-hash = { workspace = true }
snmalloc-rs = { workspace = true, optional = true }
winemetal-sys = { workspace = true }
xbr = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
dxmt-fakes = { path = "../dxmt/fakes" }

[lints]
workspace = true
