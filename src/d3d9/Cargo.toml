[package]
name = "d3d9"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Zlib"
description = "Direct3D 9 translation layer for Wine on macOS, backed by Metal"
authors = ["Alexander Theissen <alex.theissen@me.com>"]

[lib]
crate-type = ["staticlib"]

[features]
# D3D9's developer timers; mtld3d.so needs the same (meson's d3d9_perf_tracking sets both).
perf-tracking = ["mtld3d-core/perf-tracking", "mtld3d-shared/perf-tracking"]
# DXMT_PERF_BUILD: lines below warnings compiled out.
perf-build = ["mtld3d-shared/perf-build"]

[dependencies]
bitflags = { workspace = true }
dxmt-util = { workspace = true }
mtld3d-core = { workspace = true }
mtld3d-shared = { workspace = true }
mtld3d-types = { workspace = true }
log = { workspace = true }
rustc-hash = { workspace = true }
snmalloc-rs = { workspace = true }
xbr = { workspace = true }
xxhash-rust = { workspace = true }

[lints]
workspace = true
