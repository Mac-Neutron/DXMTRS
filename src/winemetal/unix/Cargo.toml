[package]
name = "winemetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "LGPL-2.1-or-later"
description = "DXMT's winemetal: the Unix side of its Unix calls, over Metal"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
# The native winemetal.dylib's code (DXMT_NATIVE in the C): the memory, present and WSI hooks, the
# native event functions, the native cache class names and winemetal.h's C entry points.
native = ["dep:winemetal-pe"]

# The framework crates keep their default features, which enable every header; the feature lists
# document the headers the lanes' handlers send to.
[dependencies]
# The shader translator: the `SM50*` handlers call it, and the images get its exports through this library.
airconv = { workspace = true }
block2 = { workspace = true }
dispatch2 = { workspace = true }
libc = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["block2", "CFCGTypes", "CFData", "CFRunLoop", "CFString"] }
objc2-core-graphics = { workspace = true, features = [
    "CGColor",
    "CGColorSpace",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGImage",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSAutoreleasePool",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSException",
    "NSKeyValueObserving",
    "NSNotification",
    "NSNull",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSString",
    "NSThread",
    "NSURL",
    "NSValue",
] }
objc2-metal = { workspace = true, features = [
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLArgument",
    "MTLBinaryArchive",
    "MTLBlitCommandEncoder",
    "MTLBlitPass",
    "MTLBuffer",
    "MTLCaptureManager",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePass",
    "MTLComputePipeline",
    "MTLCounters",
    "MTLDataType",
    "MTLDepthStencil",
    "MTLDevice",
    "MTLDrawable",
    "MTLEvent",
    "MTLFence",
    "MTLFunctionConstantValues",
    "MTLFunctionLog",
    "MTLHeap",
    "MTLIndirectCommandBuffer",
    "MTLLibrary",
    "MTLPipeline",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResidencySet",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
] }
objc2-metal-fx = { workspace = true, features = ["MTLFXFrameInterpolator", "MTLFXSpatialScaler", "MTLFXTemporalScaler"] }
objc2-quartz-core = { workspace = true, features = [
    "CALayer",
    "CAMetalLayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
] }
rustc-hash = { workspace = true }
winemetal-pe = { workspace = true, optional = true }
winemetal-wire = { workspace = true }
snmalloc-rs = { workspace = true }
xxhash-rust = { workspace = true }

[lints]
workspace = true
