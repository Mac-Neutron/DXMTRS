[package]
name = "d3d11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DXMT's d3d11.dll and d3d11.dylib"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
# Enables the Rust D3D11 and D3D10 front end and its #[unsafe(no_mangle)] DLL exports.
front-end = []
# DXMT_PERF_BUILD (meson sets it when -DDXMT_PERF_BUILD is in cpp_args): the core's statistics and dump folder compile
# to nothing and the log drops everything below warnings.
perf-build = ["dxmt-core/perf-build", "dxmt-util/perf-build"]
# The VM guest's build (meson sets it from the guest_vm option).
guest-vm = ["dxmt-core/guest-vm"]

[lints]
workspace = true

[dependencies]
airconv-ir = { path = "../airconv/ir" }
bitflags = { workspace = true }
dxmt-core = { workspace = true }
dxmt-util = { workspace = true }
rustc-hash = { workspace = true }
winemetal-sys = { workspace = true }
xxhash-rust = { workspace = true }
winemetal-wire = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
snmalloc-rs = { workspace = true }

