<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1146 500" width="1146" height="500" role="img" aria-labelledby="title desc">
  <title id="title">D3D9 component diagram</title>
  <desc id="desc">game.exe calls d3d9.dll through the D3D9 COM API. d3d9.dll holds the COM API and application state, links mtld3d-core, dxmt-core, and airconv, and calls winemetal.dll. winemetal.dll crosses the Wine PE/Unix boundary into winemetal.so, the native unix library that drives the Metal framework. The PE side is i386 or x86_64, one chain per architecture, and on an arm64 Wine an x64 game loads ARM64X builds of d3d9.dll and winemetal.dll instead; the host side is Mach-O in Wine's own architecture.</desc>
  <style>
    text { fill: #768390; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
    .mono { fill: #6e7b8b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }
    .stereo { font-size: 11px; font-style: italic; }
    .muted { font-size: 11px; }
    .tab { font-weight: 700; font-size: 12px; }
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .frame { fill: #8b949e; fill-opacity: 0.06; stroke: #8b949e; stroke-width: 1.2; }
    .box, .icon { fill: #8b949e; fill-opacity: 0.10; stroke: #768390; stroke-width: 1.4; }
    .icon { stroke-width: 1; }
    .ext { fill: #4493f8; fill-opacity: 0.14; stroke: #4493f8; stroke-width: 1.4; }
    .edge { fill: none; stroke: #768390; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .head { fill: none; stroke: #768390; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path class="head" d="M1 1 L11 6 L1 11"/>
    </marker>
    <g id="cmp">
      <rect class="icon" x="0" y="0" width="14" height="16"/>
      <rect class="icon" x="-4" y="3" width="8" height="3.5"/>
      <rect class="icon" x="-4" y="9.5" width="8" height="3.5"/>
    </g>
  </defs>

  <!-- PE side package -->
  <path class="frame" d="M12 40 H116 V26 H12 Z"/>
  <text class="tab" x="20" y="37">Wine PE side</text>
  <rect class="frame" x="12" y="40" width="710" height="444"/>
  <text class="muted" x="26" y="62">i386 or x86_64, one chain per architecture; ARM64X for x64 games on an arm64 Wine</text>

  <!-- Host side package -->
  <path class="frame" d="M836 40 H922 V26 H836 Z"/>
  <text class="tab" x="844" y="37">Host side</text>
  <rect class="frame" x="836" y="40" width="298" height="444"/>
  <text class="muted" x="850" y="62">Mach-O, Wine's own architecture</text>
  <text class="muted" x="850" y="77">(x86_64 or arm64)</text>

  <!-- game.exe -->
  <rect class="box" x="32" y="110" width="150" height="84"/>
  <use href="#cmp" x="160" y="118"/>
  <text class="stereo" x="107" y="136" text-anchor="middle">«executable»</text>
  <text class="mono" x="107" y="158" text-anchor="middle">game.exe</text>
  <text class="muted" x="107" y="178" text-anchor="middle">the game</text>

  <!-- d3d9.dll with nested mtld3d-core, dxmt-core, and airconv -->
  <rect class="box" x="244" y="96" width="210" height="236"/>
  <use href="#cmp" x="432" y="104"/>
  <text class="stereo" x="349" y="122" text-anchor="middle">«library»</text>
  <text class="mono" x="349" y="144" text-anchor="middle">d3d9.dll</text>
  <text class="muted" x="349" y="163" text-anchor="middle">COM API, state, d3d9::rt</text>
  <rect class="box" x="260" y="176" width="178" height="44"/>
  <text class="stereo" x="349" y="193" text-anchor="middle">«rlib»</text>
  <text class="mono" x="349" y="211" text-anchor="middle" style="font-size:13px">mtld3d-core</text>
  <rect class="box" x="260" y="226" width="178" height="44"/>
  <text class="stereo" x="349" y="243" text-anchor="middle">«rlib»</text>
  <text class="mono" x="349" y="261" text-anchor="middle" style="font-size:13px">dxmt-core</text>
  <rect class="box" x="260" y="276" width="178" height="44"/>
  <text class="stereo" x="349" y="293" text-anchor="middle">«rlib»</text>
  <text class="mono" x="349" y="311" text-anchor="middle" style="font-size:13px">airconv</text>

  <!-- winemetal.dll -->
  <rect class="box" x="542" y="110" width="160" height="84"/>
  <use href="#cmp" x="680" y="118"/>
  <text class="stereo" x="622" y="136" text-anchor="middle">«library»</text>
  <text class="mono" x="622" y="158" text-anchor="middle">winemetal.dll</text>
  <text class="muted" x="622" y="178" text-anchor="middle">PE / unix-call</text>

  <!-- winemetal.so -->
  <rect class="box" x="856" y="96" width="262" height="220"/>
  <use href="#cmp" x="1096" y="104"/>
  <text class="stereo" x="987" y="122" text-anchor="middle">«library»</text>
  <text class="mono" x="987" y="144" text-anchor="middle">winemetal.so</text>
  <text class="muted" x="987" y="163" text-anchor="middle">native unix library</text>
  <rect class="box" x="868" y="176" width="117" height="58"/>
  <text class="stereo" x="926.5" y="192" text-anchor="middle">«unix»</text>
  <text class="mono" x="926.5" y="210" text-anchor="middle" style="font-size:12.5px">Metal</text>
  <text class="muted" x="926.5" y="226" text-anchor="middle">commands, PSOs</text>
  <rect class="box" x="989" y="176" width="117" height="58"/>
  <text class="stereo" x="1047.5" y="192" text-anchor="middle">«unix»</text>
  <text class="mono" x="1047.5" y="210" text-anchor="middle" style="font-size:12.5px">present</text>
  <text class="muted" x="1047.5" y="226" text-anchor="middle">layer, drawable</text>
  <rect class="box" x="868" y="242" width="238" height="58"/>
  <text class="stereo" x="987" y="261" text-anchor="middle">«unix»</text>
  <text class="mono" x="987" y="280" text-anchor="middle" style="font-size:12.5px">macOS runtime</text>
  <text class="muted" x="987" y="294" text-anchor="middle">handles, events, shader cache</text>

  <!-- Metal -->
  <rect class="ext" x="907" y="368" width="160" height="70"/>
  <text class="stereo" x="987" y="394" text-anchor="middle">«framework»</text>
  <text class="mono" x="987" y="416" text-anchor="middle">Metal</text>

  <!-- dependencies -->
  <path class="edge" d="M182 152 H242" marker-end="url(#open)"/>
  <text class="label" x="212" y="144" text-anchor="middle">D3D9 COM</text>

  <path class="edge" d="M454 152 H540" marker-end="url(#open)"/>
  <text class="label" x="497" y="144" text-anchor="middle">WMT*</text>
  <text class="muted" x="497" y="172" text-anchor="middle">DLL import</text>

  <path class="edge" d="M702 152 H854" marker-end="url(#open)"/>
  <text class="label" x="779" y="144" text-anchor="middle">Wine unix call</text>
  <text class="muted" x="779" y="172" text-anchor="middle">PE/Unix</text>
  <text class="muted" x="779" y="186" text-anchor="middle">boundary</text>

  <path class="edge" d="M987 316 V366" marker-end="url(#open)"/>
  <text class="label" x="995" y="346">Metal API</text>
</svg>
